{%extends 'base.html'%} {%block title%} Login{%endblock%} {%block content%}
<h1>Login page</h1>
<a href="{{url_for('home')}}">Home </a>

<form method="POST">
  {{form.hidden_tag()}}
  <div>
    <p>{{form.username.label}}{{form.username()}}</p>

  </div>
</form>
{%endblock%}
